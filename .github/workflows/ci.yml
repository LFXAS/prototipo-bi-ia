name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-flow:
    name: Validate branch flow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.base_ref }}
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v7
      - name: Test and validate branch policy
        run: |
          make workflow-test
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace alpine:3.22 \
            ./scripts/validate-branch-flow.sh "$BASE_BRANCH" "$HEAD_BRANCH"

  compose:
    name: Validate Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate isolated stack configuration
        run: docker compose config --quiet

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build test stage
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: test
          push: false
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build test stage
        uses: docker/build-push-action@v7
        with:
          context: frontend
          target: test
          push: false
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

  infrastructure:
    name: Infrastructure image - ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: postgres
            context: infra/postgres
          - component: sqlserver
            context: infra/sqlserver
          - component: docs
            context: infra/docs
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build production stage
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: production
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}-test
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-test

  documentation:
    name: Compile LaTeX documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build LaTeX image
        run: docker build --target production -t bi-ia-docs:test infra/docs
      - name: Compile logbook
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v "$PWD/docs/logbook:/workspace" -w /workspace
          bi-ia-docs:test -pdf -interaction=nonstopmode -halt-on-error bitacora.tex
      - name: Compile Sprint 1 report
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v "$PWD/docs:/workspace" -w /workspace/sprints
          bi-ia-docs:test -pdf -interaction=nonstopmode -halt-on-error sprint-01-entorno.tex
      - name: Compile technical manual
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v "$PWD/docs:/workspace" -w /workspace/manual-tecnico
          bi-ia-docs:test -pdf -interaction=nonstopmode -halt-on-error manual-tecnico.tex
      - name: Ensure versioned PDFs are current
        run: >-
          git diff --exit-code --
          docs/logbook/bitacora.pdf
          docs/sprints/sprint-01-entorno.pdf
          docs/manual-tecnico/manual-tecnico.pdf
      - uses: actions/upload-artifact@v7
        with:
          name: documentacion-tecnica
          path: |
            docs/logbook/bitacora.pdf
            docs/sprints/sprint-01-entorno.pdf
            docs/manual-tecnico/manual-tecnico.pdf
