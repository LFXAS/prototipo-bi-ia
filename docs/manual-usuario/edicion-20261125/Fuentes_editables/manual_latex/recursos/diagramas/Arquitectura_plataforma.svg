<svg xmlns="http://www.w3.org/2000/svg" width="23.0cm" height="12.26667cm" viewBox="0 0 900 480">
<title>Arquitectura de la plataforma inteligente de datamarts de ventas</title>
<desc>Las personas operan una interfaz React. FastAPI centraliza los permisos, los metadatos, la revisión del diseño, la carga controlada y la analítica. Consulta las fuentes SQL Server en lectura y conserva configuración, versiones y datamarts en PostgreSQL. OpenAI y los demás adaptadores de inteligencia artificial reciben contexto autorizado y devuelve propuestas y explicaciones sujetas a validación; la aprobación corresponde a una persona autorizada.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#334F69"/></marker>
</defs>
<rect width="900" height="480" fill="#FFFFFF"/>

