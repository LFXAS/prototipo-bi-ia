<text x="35" y="379" font-family="Times New Roman, serif" font-size="15" font-weight="700" text-anchor="start" fill="#141C24">SQL Server</text>
<text x="35" y="402" font-family="Times New Roman, serif" font-size="15" font-weight="400" text-anchor="start" fill="#141C24">AdventureWorks2022</text>
