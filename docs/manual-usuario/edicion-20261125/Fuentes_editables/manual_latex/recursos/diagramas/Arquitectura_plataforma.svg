<text x="35" y="228" font-family="Times New Roman, serif" font-size="15" font-weight="400" text-anchor="start" fill="#141C24">Asistente de diseño</text>
<text x="35" y="250" font-family="Times New Roman, serif" font-size="15" font-weight="400" text-anchor="start" fill="#141C24">Panel y copiloto</text>
