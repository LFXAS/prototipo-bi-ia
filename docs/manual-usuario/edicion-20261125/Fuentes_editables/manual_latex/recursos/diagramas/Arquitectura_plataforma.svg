<text x="260" y="68" font-family="Times New Roman, serif" font-size="15" font-weight="400" text-anchor="start" fill="#141C24">Python y FastAPI</text>
<rect x="258" y="92" width="376" height="60" rx="5" fill="#FFFFFF" stroke="#A7B3BE" stroke-width="1"/>
<text x="273" y="114" font-family="Times New Roman, serif" font-size="15" font-weight="700" text-anchor="start" fill="#141C24">Fuentes y metadatos</text>
<text x="273" y="135" font-family="Times New Roman, serif" font-size="15" font-weight="400" text-anchor="start" fill="#141C24">Lectura del esquema y catálogo por fuente</text>
