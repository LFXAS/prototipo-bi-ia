<text x="705" y="138" font-family="Times New Roman, serif" font-size="15" font-weight="400" text-anchor="start" fill="#141C24">OpenAI u otros</text>
<text x="705" y="164" font-family="Times New Roman, serif" font-size="15" font-weight="400" text-anchor="start" fill="#141C24">Local o en la nube</text>
<text x="705" y="188" font-family="Times New Roman, serif" font-size="15" font-weight="400" text-anchor="start" fill="#141C24">Recibe contexto</text>
<text x="705" y="207" font-family="Times New Roman, serif" font-size="15" font-weight="400" text-anchor="start" fill="#141C24">autorizado, sin credenciales.</text>
<text x="705" y="234" font-family="Times New Roman, serif" font-size="15" font-weight="400" text-anchor="start" fill="#141C24">Propone y explica.</text>
<text x="705" y="253" font-family="Times New Roman, serif" font-size="15" font-weight="400" text-anchor="start" fill="#141C24">Su salida se valida.</text>
