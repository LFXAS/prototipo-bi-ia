<svg xmlns="http://www.w3.org/2000/svg" width="23cm" height="12.26667cm" viewBox="0 0 900 480"><title>Estructura física conservada del datamart, ejecución 21</title><desc>Todas las columnas de las cinco tablas físicas observadas. Los nombres y atributos corresponden a esta ejecución, no son un modelo fijo universal. Las líneas discontinuas representan la unión que efectúa el motor entre dim_*_sk y surrogate_key; la base no las impone como FK. No se atribuyen cardinalidades garantizadas a esas líneas.</desc><rect width="900" height="480" fill="white"/><path d="M265 140 L300 140 L300 280 L330 280" fill="none" stroke="#567184" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M265 360 L330 360" fill="none" stroke="#567184" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M455 168 L455 215" fill="none" stroke="#567184" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M575 300 L635 300" fill="none" stroke="#567184" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="20" y="45" width="245" height="199" rx="3" fill="white" stroke="#567184" stroke-width="1.4"/><path d="M20 76 H265" stroke="#567184"/><rect x="21" y="46" width="243" height="29" fill="#EBF2F7"/><text x="29" y="67" font-family="Times New Roman" font-size="15" font-weight="700" text-anchor="start" fill="#253E53">dim_producto</text><text x="29" y="94" font-family="Times New Roman" font-size="15" font-weight="400" text-anchor="start" fill="#253E53">surrogate_key [PK]</text><text x="29" y="112" font-family="Times New Roman" font-size="15" font-weight="400" text-anchor="start" fill="#253E53">productid</text><text x="29" y="130" font-family="Times New Roman" font-size="15" font-weight="400" text-anchor="start" fill="#253E53">name</text><text x="29" y="148" font-family="Times New Roman" font-size="15" font-weight="400" text-anchor="start" fill="#253E53">sizeunitmeasurecode</text><text x="29" y="166" font-family="Times New Roman" font-size="15" font-weight="400" text-anchor="start" fill="#253E53">productnumber<