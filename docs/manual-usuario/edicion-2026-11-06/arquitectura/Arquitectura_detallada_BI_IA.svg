<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc"><title id="title">Arquitectura de la plataforma inteligente de BI</title><desc id="desc">Cuatro servicios base en Docker: interfaz React, servidor FastAPI, SQL Server de sólo lectura con AdventureWorks2022 y WideWorldImporters, y PostgreSQL como persistencia y destino analítico. El proveedor de inteligencia artificial configurable intercambia sólo contexto autorizado con FastAPI. Una persona autorizada aprueba antes de la carga controlada y conciliada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#008D91"/></marker><marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21485E"/></marker></defs><rect width="1600" height="1130" fill="white"/>
